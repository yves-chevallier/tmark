name: CI

on:
  push:
    branches: [main, texsmith-migration]
  pull_request:

jobs:
  rust:
    name: cargo test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all --check
      - name: Generated artifacts are current
        run: |
          cargo run -q -p tmark-ir --example schema
          cargo run -q -p tmark-ir --example registries
          git diff --exit-code

  python:
    name: tmark-py wheel and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the bindings
        run: |
          python -m venv .venv && . .venv/bin/activate
          pip install -q maturin pytest
          maturin develop -m crates/tmark-py/Cargo.toml
          pytest -q crates/tmark-py/tests
