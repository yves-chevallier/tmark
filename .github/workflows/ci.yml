name: CI

on:
  push:
    branches: [main, texsmith-migration]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    name: cargo test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all --check
      - name: Generated artifacts are current
        run: |
          cargo run -q -p tmark-ir --example schema
          cargo run -q -p tmark-ir --example registries
          git diff --exit-code

  msrv:
    # AGENTS.md pins `rust-version = "1.80"` in the workspace Cargo.toml;
    # this job holds the workspace to it (build and test only — clippy and
    # fmt are the stable job's job) so a newer-std construct like
    # `Option::is_none_or` (see design/13-handoff.md "Pitfalls learned")
    # cannot creep back in unnoticed.
    name: cargo test (MSRV 1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  python:
    name: tmark-py wheel and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the bindings
        run: |
          python -m venv .venv && . .venv/bin/activate
          pip install -q maturin pytest
          maturin develop -m crates/tmark-py/Cargo.toml
          pytest -q crates/tmark-py/tests
