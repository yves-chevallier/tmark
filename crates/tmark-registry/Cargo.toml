[package]
name = "tmark-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["fs"]
# `FsLoader`: the one `Loader` that touches the file system. Off for WASM.
fs = []

[dependencies]
tmark-ir = { path = "../tmark-ir" }
tmark-syntax = { path = "../tmark-syntax" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
# `.bib` files (design/06-registries.md §Load sources).
biblatex = "0.12"
