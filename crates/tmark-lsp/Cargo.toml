[package]
name = "tmark-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tmark-lsp"
path = "src/main.rs"

[dependencies]
tmark = { path = "../tmark" }
# Synchronous LSP transport and the protocol types (ADR 0007); edge crate.
lsp-server = { workspace = true }
lsp-types = { workspace = true }
# The protocol payloads are JSON.
serde = { workspace = true }
serde_json = { workspace = true }
# `lsp-server` hands out crossbeam channels; `select!` over them and the
# worker's result channel is the main loop.
crossbeam-channel = { workspace = true }
