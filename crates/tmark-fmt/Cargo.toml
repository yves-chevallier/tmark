tmark-ir = { path = "../tmark-ir" }

[dev-dependencies]
# Round-trip tests: parse(print(doc)) == doc.
tmark-syntax = { path = "../tmark-syntax" }
# Scratch example and JSON dumps in tests.
serde_json = { workspace = true }
