[package]
name = "tmark-writers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Writers read the IR...
tmark-ir = { path = "../tmark-ir" }
# ...and the resolution (numbers, labels, citations); never the file system.
tmark-registry = { path = "../tmark-registry", default-features = false }
# The web lowering (`mkdocs.rs`) splices its replacements through `edit_many`
# and prints untouched children in the `Mkdocs` profile (web-profile.md).
tmark-fmt = { path = "../tmark-fmt" }
# `Body`, `Requires` and `SourceMap` cross to Python and to `tmark write --map`
# as JSON (design/07-writers.md, writers-and-passes.md §1).
serde = { workspace = true }
# `press.declare.acronyms` is a JSON map in the front matter (common/abbr.rs).
serde_json = { workspace = true }

[dev-dependencies]
# Tests parse their inputs.
tmark-syntax = { path = "../tmark-syntax" }
# One snapshot per conformance fixture and per backend (design/10-testing.md §4).
insta = { workspace = true }
